name: CombatIQ native v4 source tests
on:
  push:
    branches: ['combatiq/phase4-sprint-correlation']
    paths: ['combatiq/native-v4/**', '.github/workflows/combatiq-native-v4.yml']
  pull_request:
    branches: ['combatiq/phase3-native-integration']
    paths: ['combatiq/native-v4/**', '.github/workflows/combatiq-native-v4.yml']
permissions:
  contents: read
jobs:
  native-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Existing standalone kernel and protocol regressions
        run: python3 combatiq/build.py
      - name: Native bridge mocks, replay and synthetic installer transactions
        run: python3 -m unittest discover -s combatiq/native-v4 -p 'test*.py' -v
