name: CombatIQ standalone kernel
on:
  push:
    branches: ['combatiq/passive-analyzer']
    paths: ['combatiq/**', '.github/workflows/combatiq.yml']
  pull_request:
    branches: ['lean/overhaul3']
    paths: ['combatiq/**', '.github/workflows/combatiq.yml']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and execute the Java 8 telemetry/replay tests
        run: python3 combatiq/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combatiq-java-${{ matrix.java }}
          path: |
            combatiq/build/combatiq-kernel.jar
            combatiq/build/test-results.txt
            combatiq/build/validation.json
          if-no-files-found: warn
